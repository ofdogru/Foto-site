<title>Kontak Föyü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --paper:#FBFBF9;
    --paper-2:#F1F2ED;
    --ink:#26282A;
    --ink-soft:#4A4D49;
    --muted:#84887F;
    --line:#E4E5DF;
    --accent:#167C74;
    --accent-ink:#0B3F3B;
    --amber:#C97A22;
    --amber-soft:#E8D9BE;
    --frame-shadow: 0 1px 0 rgba(38,40,42,0.06);
    --overlay: rgba(20,20,18,0.6);
  }
  /* Not: site kasıtlı olarak her zaman açık (light) temada kalır — ziyaretçinin
     cihazı karanlık modda olsa bile arka plan koyuya dönmez. */

  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .mono{font-family:'Space Mono', ui-monospace, monospace;}
  .serif{font-family:'Instrument Serif', ui-serif, Georgia, serif;}

  /* ---- shell: sol menü + sağ içerik ---- */
  .shell{
    display:flex;
    max-width:1400px;
    margin:0 auto;
    min-height:100vh;
  }

  .sidebar{
    flex:0 0 264px;
    width:264px;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:26px;
    padding:30px 24px;
    border-right:1px solid var(--line);
  }

  .sidebar-top{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    appearance:none; -webkit-appearance:none;
    display:block;
    background:none;
    border:0;
    padding:0;
    margin:0;
    text-align:left;
    cursor:pointer;
    font-family:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    font-weight:800;
    font-size:21px;
    line-height:1.2;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .brand:hover{color:var(--accent-ink);}
  .brand:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .sidebar-tag{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .sidebar-section{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .sidebar-section-label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    padding:0 10px 6px;
  }
  .nav-btn{
    appearance:none; -webkit-appearance:none;
    display:block;
    width:100%;
    text-align:left;
    font:inherit;
    font-size:14px;
    background:transparent;
    border:0;
    border-radius:6px;
    color:var(--ink-soft);
    padding:9px 10px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .nav-btn:hover{background:var(--paper-2); color:var(--ink);}
  .nav-btn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .nav-btn.is-active{background:var(--accent); color:#F4FAF9;}

  .sidebar-foot{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:5px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:11px;
    color:var(--muted);
  }
  .sidebar-foot a{
    color:var(--muted);
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:3px;
  }
  .sidebar-foot a:hover{color:var(--accent-ink); text-decoration-color:var(--accent);}
  .sidebar-social{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px; height:26px;
    margin-top:6px;
    border-radius:50%;
    border:1px solid var(--line);
    color:var(--muted);
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .sidebar-social svg{width:13px; height:13px; fill:currentColor; display:block;}
  .sidebar-social:hover{color:var(--accent-ink); border-color:var(--accent); background:rgba(22,124,116,0.08);}
  .sidebar-social:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .content{
    flex:1 1 auto;
    min-width:0;
    padding:34px 40px 70px;
  }

  /* ---- anasayfa: grup kapağı ızgarası ---- */
  .home-intro{margin-bottom:28px; max-width:64ch;}
  .home-intro h1{
    margin:0 0 8px;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(28px,4vw,42px);
    line-height:1.06;
  }
  .home-intro p{
    margin:0;
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  .home-hero{
    margin:0 0 32px;
    border-radius:2px;
    overflow:hidden;
    box-shadow:var(--frame-shadow);
  }
  .home-hero img{
    display:block;
    width:100%;
    max-height:62vh;
    object-fit:cover;
    background:var(--paper-2);
  }

  .note{
    display:flex;
    gap:12px;
    align-items:flex-start;
    border:1px dashed var(--line);
    border-radius:3px;
    padding:14px 16px;
    margin-bottom:28px;
    background:var(--paper-2);
    max-width:70ch;
  }
  .note .dot{
    flex:0 0 auto;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--amber);
    margin-top:6px;
  }
  .note p{
    margin:0;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .note strong{color:var(--ink);}

  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
    gap:3px;
  }
  button.cat-tile{
    appearance:none; -webkit-appearance:none;
    position:relative;
    display:block;
    width:100%;
    margin:0;
    padding:0;
    font:inherit;
    color:inherit;
    text-align:left;
    cursor:pointer;
    border:0;
    border-radius:0;
    overflow:hidden;
    aspect-ratio:3/4;
    background:var(--paper-2);
  }
  button.cat-tile:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .cat-tile canvas{display:block; width:100%; height:100%;}
  .cat-tile img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    background:var(--paper-2);
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    transition:transform .5s ease, filter .5s ease;
  }
  button.cat-tile:hover img{transform:scale(1.04);}
  @media (hover:hover){
    .cat-tile img{filter:grayscale(0.9) saturate(0.55) brightness(0.96);}
    button.cat-tile:hover img,
    button.cat-tile:focus-visible img{filter:grayscale(0) saturate(1) brightness(1);}
  }
  .cat-tile-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:flex-start;
    gap:4px;
    padding:16px 18px 14px;
    text-align:left;
    background:linear-gradient(to top, rgba(11,63,59,0.85) 0%, rgba(11,63,59,0.42) 32%, rgba(11,63,59,0) 62%);
    opacity:0;
    transition:opacity .3s ease;
  }
  .cat-tile-overlay .cat-tile-name{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(20px,2.4vw,27px);
    color:#FBFBF9;
    text-shadow:0 1px 3px rgba(0,0,0,0.35);
  }
  .cat-tile-overlay .cat-tile-sub{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(251,251,249,0.85);
    text-shadow:0 1px 3px rgba(0,0,0,0.35);
  }
  @media (hover:hover){
    button.cat-tile:hover .cat-tile-overlay,
    button.cat-tile:focus-visible .cat-tile-overlay{opacity:1;}
  }
  @media (hover:none){
    .cat-tile-overlay{opacity:1;}
  }

  /* ---- sayfa panelleri (Hakkımda / İletişim / Sosyal Medya) ---- */
  .page-panel{max-width:620px;}
  .page-panel h2{
    margin:0 0 16px;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(26px,4vw,36px);
  }
  .page-panel p{
    margin:0 0 14px;
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
  }
  .page-panel p:last-child{margin-bottom:0;}
  .page-panel strong{color:var(--ink); font-weight:600;}
  .about-panel{max-width:860px;}
  .about-wrap{
    display:flex;
    align-items:flex-start;
    gap:40px;
    margin-top:8px;
  }
  .about-photo{
    flex:0 0 280px;
    margin:0;
  }
  .about-photo img{
    display:block;
    width:100%;
    height:auto;
    border-radius:2px;
    border:1px solid var(--line);
    box-shadow:0 10px 28px rgba(38,40,42,0.14);
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .about-text{flex:1 1 auto; min-width:0;}
  .about-text p:first-child{margin-top:0;}
  @media (max-width:720px){
    .about-wrap{flex-direction:column; gap:24px;}
    .about-photo{flex:none; width:100%; max-width:260px; margin:0 auto;}
  }
  .social-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .social-list a{
    font-size:15px;
    color:var(--accent-ink);
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:3px;
  }
  .social-list a:hover{text-decoration-color:var(--accent);}

  /* ---- iletişim formu ---- */
  .contact-form{
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:480px;
    margin-top:22px;
  }
  .contact-form label{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .contact-form input,
  .contact-form textarea{
    font:inherit;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 12px;
    resize:vertical;
  }
  .contact-form input:focus,
  .contact-form textarea:focus{
    outline:none;
    border-color:var(--accent);
  }
  .contact-submit{
    appearance:none;
    -webkit-appearance:none;
    align-self:flex-start;
    font:inherit;
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    border:1px solid var(--accent);
    background:var(--accent);
    color:#F4FAF9;
    padding:11px 24px;
    border-radius:20px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .contact-submit:hover{opacity:0.88;}
  .contact-submit:disabled{opacity:0.6; cursor:default;}
  .contact-note{
    max-width:480px;
    margin-top:18px;
    padding:14px 16px;
    border-radius:3px;
    font-size:14px;
    line-height:1.55;
  }
  .contact-note.is-success{background:rgba(22,124,116,0.1); border:1px solid rgba(22,124,116,0.35); color:var(--accent-ink);}
  .contact-note.is-error{background:rgba(201,122,34,0.1); border:1px solid rgba(201,122,34,0.35); color:var(--amber);}
  .social-row{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
    margin-top:36px;
    padding-top:22px;
    border-top:1px solid var(--line);
    max-width:480px;
  }
  .social-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    text-decoration:none;
    color:var(--ink-soft);
  }
  .social-btn .social-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid var(--line);
    color:var(--ink-soft);
    transition:border-color .15s ease, color .15s ease, background-color .15s ease;
  }
  .social-btn .social-icon svg{width:20px; height:20px; fill:currentColor; display:block;}
  .social-btn .social-label{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-family:'Space Mono', monospace;
    transition:color .15s ease;
  }
  .social-btn:hover .social-icon{border-color:var(--accent); color:var(--accent-ink); background:rgba(22,124,116,0.08);}
  .social-btn:hover .social-label{color:var(--accent-ink);}
  .social-btn:focus-visible .social-icon{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---- grup detayı: geri düğmesi + büyük foto akışı ---- */
  .cat-back{
    appearance:none; -webkit-appearance:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:0;
    padding:0;
    margin-bottom:16px;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--muted);
    cursor:pointer;
  }
  .cat-back:hover{color:var(--accent-ink);}
  .cat-back:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .cat-view-head{max-width:70ch; margin-bottom:8px;}
  .cat-view-head h2{
    margin:0 0 8px;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(26px,4vw,38px);
  }
  .cat-view-head p{
    margin:0;
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  .cat-feed{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:3px;
    margin-top:30px;
  }
  button.cat-feed-art{
    appearance:none; -webkit-appearance:none;
    position:relative;
    display:block;
    width:100%;
    margin:0;
    padding:0;
    font:inherit;
    color:inherit;
    text-align:left;
    cursor:zoom-in;
    border:0;
    border-radius:0;
    aspect-ratio:4/5;
    overflow:hidden;
    background:var(--paper-2);
  }
  button.cat-feed-art:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .cat-feed-art canvas{display:block; width:100%; height:100%;}
  .cat-feed-art img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    background:var(--paper-2);
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    transition:transform .5s ease;
  }
  button.cat-feed-art:hover img,
  button.cat-feed-art:focus-visible img{transform:scale(1.04);}
  .frame-no{
    position:absolute;
    top:8px; left:10px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#F1EFE4;
    text-shadow:0 1px 2px rgba(0,0,0,0.55);
    letter-spacing:0.02em;
    z-index:1;
  }
  .feed-tile-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:flex-start;
    gap:3px;
    padding:14px 16px 12px;
    text-align:left;
    background:linear-gradient(to top, rgba(11,63,59,0.82) 0%, rgba(11,63,59,0.38) 30%, rgba(11,63,59,0) 60%);
    opacity:0;
    transition:opacity .3s ease;
  }
  @media (hover:hover){
    button.cat-feed-art:hover .feed-tile-overlay,
    button.cat-feed-art:focus-visible .feed-tile-overlay{opacity:1;}
  }
  @media (hover:none){ .feed-tile-overlay{opacity:1;} }
  .feed-tile-overlay .feed-tile-cap{
    font-size:13.5px;
    line-height:1.35;
    color:#FBFBF9;
    text-shadow:0 1px 3px rgba(0,0,0,0.35);
  }
  .feed-tile-overlay .feed-tile-teknik{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.02em;
    color:rgba(251,251,249,0.8);
    text-shadow:0 1px 3px rgba(0,0,0,0.35);
  }

  /* ---- lightbox ---- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
  }
  .lightbox[hidden]{display:none;}
  .lightbox-backdrop{
    position:absolute;
    inset:0;
    background:rgba(8,8,7,0.94);
    -webkit-backdrop-filter:blur(30px) saturate(1.05);
    backdrop-filter:blur(30px) saturate(1.05);
    border:0;
    padding:0;
    margin:0;
    cursor:default;
  }
  .lightbox-panel{
    position:relative;
    z-index:1;
    max-width:98vw;
    max-height:calc(100vh - 24px);
    overflow-y:auto;
    overflow-x:hidden;
  }
  .lightbox-stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:32px;
  }
  .lightbox-close,
  .lightbox-nav{
    position:fixed;
    z-index:3;
    width:40px; height:40px;
    border-radius:50%;
    border:1px solid rgba(251,251,249,0.18);
    background:rgba(20,20,18,0.55);
    color:#F1EFE4;
    font-size:17px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    box-shadow:0 4px 16px rgba(0,0,0,0.3);
    transition:background .15s ease, transform .15s ease;
  }
  .lightbox-close:hover,
  .lightbox-nav:hover{background:rgba(20,20,18,0.8); transform:scale(1.05);}
  .lightbox-close:focus-visible,
  .lightbox-nav:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .lightbox-close{top:18px; right:18px;}
  .lightbox-nav{top:50%; transform:translateY(-50%); font-size:20px;}
  .lightbox-nav:hover{transform:translateY(-50%) scale(1.05);}
  .lightbox-prev{left:18px;}
  .lightbox-next{right:18px;}
  .lightbox-nav[hidden]{display:none;}
  .lightbox-art{
    position:relative;
    max-width:100%;
    line-height:0;
    border-radius:2px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
  }
  .lightbox-art canvas{display:block; width:480px; max-width:100%; height:320px;}
  .lightbox-art img{
    display:block;
    width:auto;
    height:auto;
    max-width:100%;
    max-height:90vh;
    object-fit:contain;
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .lightbox-art canvas[hidden], .lightbox-art img[hidden]{display:none;}
  .lightbox-teknik{
    position:absolute;
    right:10px; bottom:10px;
    font-size:10.5px;
    letter-spacing:0.03em;
    color:rgba(251,251,249,0.88);
    background:rgba(20,20,18,0.34);
    padding:4px 9px;
    border-radius:3px;
    text-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  .lightbox-teknik[hidden]{display:none;}

  /* fotoğrafın türüne göre açıklama ya yanında (dik kareler) ya da
     içinde (sayfaya komple sığan geniş kareler) gösterilir */
  .lightbox-side{
    display:none;
    flex-direction:column;
    gap:18px;
    max-width:300px;
    flex:0 0 auto;
  }
  .lightbox-side.is-active{display:flex;}
  #lbSide .lightbox-cat{
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(241,239,228,0.55);
  }
  #lbSide .lightbox-caption{
    display:block;
    margin-top:8px;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-size:28px;
    line-height:1.35;
    color:#F8F7F2;
  }
  #lbSide .like-row{margin-top:22px;}

  #lbArt .lightbox-caption-box{
    position:absolute;
    left:12px;
    bottom:12px;
    max-width:68%;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  #lbArt .lightbox-cat{
    font-size:9.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(251,251,249,0.7);
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  #lbArt .lightbox-caption{
    display:block;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-size:16px;
    line-height:1.3;
    color:rgba(251,251,249,0.92);
    text-shadow:0 1px 3px rgba(0,0,0,0.55);
  }
  #lbArt .like-row{
    margin-top:5px;
    transform:scale(0.82);
    transform-origin:left bottom;
  }

  function makeMedia(f, altPrefix){
    var media;
    if(f.photo){
      media = document.createElement('img');
      media.src = f.photo;
      media.alt = (altPrefix || (f.label + ' — ' + f.cap));
      media.loading = 'lazy';
      media.decoding = 'async';
      media.draggable = false;
      media.oncontextmenu = function(){ return false; };
    } else {
      media = document.createElement('canvas');
    }
    return media;
  }

  function setActive(routeId){
    document.querySelectorAll('.nav-btn').forEach(function(b){
      b.classList.toggle('is-active', b.dataset.route === routeId);
    });
    document.getElementById('brandBtn').classList.toggle('is-active', routeId === '');

  function route(){
    var hash = decodeURIComponent(location.hash.replace('#',''));
    if(hash === 'hakkimda'){ renderAbout(); setActive('hakkimda'); }
    else if(hash === 'iletisim'){ renderContact(); setActive('iletisim'); }
    else if(FRAMES_BY_CAT.hasOwnProperty(hash)){ renderCategory(hash); setActive(hash); }
    else { renderHome(); setActive(''); }
    window.scrollTo(0,0);
    content.scrollTop = 0;
  }

  function goTo(routeId){
    if(location.hash.replace('#','') === routeId){ route(); }
    else { location.hash = routeId; }
  }

  document.querySelectorAll('[data-route]').forEach(function(el){
    el.addEventListener('click', function(){ goTo(el.dataset.route); });
  });
  window.addEventListener('hashchange', route);

  // ---- girişsiz beğeni sistemi ----
  // Paylaşılan (herkes için ortak) sayaç, ücretsiz ve hesap gerektirmeyen bir
  // genel API üzerinden tutuluyor. Servis geçici olarak yanıt vermezse buton
  // yine de "beğenildi" görünür, sadece sayı görünmez — sayfa asla bozuk görünmez.
  var LIKE_NAMESPACE = 'omerfarukdogru-com-tr';
  var lbLikeBtn = document.getElementById('lbLikeBtn');
  var lbLikeCount = document.getElementById('lbLikeCount');

  function likeKey(term){ return 'begeni:' + term; }
  function hasLiked(term){
    try { return window.localStorage.getItem(likeKey(term)) === '1'; }
    catch(e){ return false; }
  }
  function markLiked(term){
    try { window.localStorage.setItem(likeKey(term), '1'); }
    catch(e){ /* localStorage yoksa sorun değil, sadece hatırlanmaz */ }
  }
  function renderLike(count, liked){
    lbLikeCount.textContent = (count === null || count === undefined) ? '—' : String(count);
    lbLikeBtn.classList.toggle('is-liked', !!liked);
    lbLikeBtn.disabled = !!liked;
  }
  function fetchLikeCount(term){
    fetch('https://api.countapi.xyz/get/' + LIKE_NAMESPACE + '/' + term)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(lbLikeBtn.dataset.term !== term) return; // kullanıcı arada başka kareye geçtiyse yoksay
        var count = (data && typeof data.value === 'number') ? data.value : null;
        renderLike(count, hasLiked(term));
      })
      .catch(function(){ /* sessizce geç */ });
  }
  lbLikeBtn.addEventListener('click', function(){
    var term = lbLikeBtn.dataset.term;
    if(!term || hasLiked(term)) return;
    markLiked(term);
    renderLike(null, true);
    fetch('https://api.countapi.xyz/hit/' + LIKE_NAMESPACE + '/' + term)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(lbLikeBtn.dataset.term !== term) return;
        var count = (data && typeof data.value === 'number') ? data.value : null;
        renderLike(count, true);
      })
      .catch(function(){ /* sessizce geç, buton yine de beğenilmiş görünür */ });
  });

  var lightbox = document.getElementById('lightbox');

  var lbCanvas = document.getElementById('lbCanvas');
  var lbImg = document.getElementById('lbImg');
  var lbCat = document.getElementById('lbCat');
  var lbCaption = document.getElementById('lbCaption');
  var lbTeknik = document.getElementById('lbTeknik');
  var lbDesc = document.getElementById('lbDesc');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var lastFocused = null;
  var lbList = null;   // açık karenin ait olduğu grup listesi (klavye/ok navigasyonu için)
  var lbIndex = -1;    // o listedeki geçerli konum

  function updateNavVisibility(){
    var canNav = !!(lbList && lbList.length > 1);
    lbPrev.hidden = !canNav;
    lbNext.hidden = !canNav;
  }

  // Açıklama, dik/kare kareler için fotoğrafın sağındaki boş alana,
  // sayfaya komple sığan geniş kareler için ise fotoğrafın içine,
  // sol alt köşeye hafif belirgin biçimde yerleştirilir.
  function updateCaptionLayout(){
    if(lightbox.hidden) return;
    var media = lbImg.hidden ? lbCanvas : lbImg;
    var mediaRect = media.getBoundingClientRect();
    var viewportW = window.innerWidth;
    var spaceRight = viewportW - mediaRect.right;
    var useSide = viewportW > 860 && spaceRight > 300;
    lbSide.classList.toggle('is-active', useSide);
    if(useSide){
      if(lbCaptionBox.parentNode !== lbSide) lbSide.appendChild(lbCaptionBox);
    } else {
      if(lbCaptionBox.parentNode !== lbArt) lbArt.appendChild(lbCaptionBox);
    }
  }

  function openLightbox(f, seed, list, idx){
    lastFocused = document.activeElement;
    lbList = list || null;
    lbIndex = (typeof idx === 'number') ? idx : -1;
    updateNavVisibility();

    lbCat.textContent = f.label;
    lbCaption.textContent = f.cap;
    if(f.teknik){
      lbTeknik.textContent = f.teknik;
      lbTeknik.hidden = false;
    } else {
      lbTeknik.textContent = '';
      lbTeknik.hidden = true;
    }
    var descText = f.desc || (f.photo ? '' : PLACEHOLDER_DESC);
    lbDesc.textContent = descText;
    lbDesc.hidden = !descText;
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
    if(f.photo){
      lbArt.classList.add('is-photo');
      lbImg.onload = updateCaptionLayout;
      lbImg.src = f.photo;
      lbImg.alt = f.label + ' — ' + f.cap;
      lbImg.draggable = false;
      lbImg.oncontextmenu = function(){ return false; };
      lbImg.hidden = false;
      lbCanvas.hidden = true;
      if(lbImg.complete) requestAnimationFrame(updateCaptionLayout);
    } else {
      lbArt.classList.remove('is-photo');
      lbCanvas.hidden = false;
      lbImg.hidden = true;
      requestAnimationFrame(function(){ paintFrame(lbCanvas, seed); updateCaptionLayout(); });
    }

    var term = 'foto-' + f.n;
    lbLikeBtn.dataset.term = term;
    renderLike(null, hasLiked(term));
    fetchLikeCount(term);

    document.getElementById('lbClose').focus();
  }

  function showLightboxAt(newIndex){
    if(!lbList || !lbList.length) return;
    var wrapped = (newIndex + lbList.length) % lbList.length;
    var f = lbList[wrapped];
    lbIndex = wrapped;
    openLightbox(f, f.seed, lbList, wrapped);
  }

  function lightboxPrev(){ if(lbList && lbList.length > 1) showLightboxAt(lbIndex - 1); }
  function lightboxNext(){ if(lbList && lbList.length > 1) showLightboxAt(lbIndex + 1); }

  function closeLightbox(){
    lightbox.hidden = true;
    document.body.style.overflow = '';
    lbList = null;
    lbIndex = -1;
    if(lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbBackdrop').addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', lightboxPrev);
  lbNext.addEventListener('click', lightboxNext);
  document.addEventListener('keydown', function(e){
    if(lightbox.hidden) return;
    if(e.key === 'Escape'){ closeLightbox(); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); lightboxPrev(); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); lightboxNext(); return; }
  });
  window.addEventListener('resize', function(){
    if(!lightbox.hidden) updateCaptionLayout();
  });

  // ---- ilk yükleme ----
  route();
})();
</script>
