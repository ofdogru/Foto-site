<title>Kontak Föyü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --paper:#FBFBF9;
    --paper-2:#F1F2ED;
    --ink:#26282A;
    --ink-soft:#4A4D49;
    --muted:#84887F;
    --line:#E4E5DF;
    --accent:#167C74;
    --accent-ink:#0B3F3B;
    --amber:#C97A22;
    --amber-soft:#E8D9BE;
    --frame-shadow: 0 1px 0 rgba(38,40,42,0.06);
    --overlay: rgba(20,20,18,0.6);
  }
  /* Not: site kasıtlı olarak her zaman açık (light) temada kalır — ziyaretçinin
     cihazı karanlık modda olsa bile arka plan koyuya dönmez. */

  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .mono{font-family:'Space Mono', ui-monospace, monospace;}
  .serif{font-family:'Instrument Serif', ui-serif, Georgia, serif;}

  /* ---- shell: sol menü + sağ içerik ---- */
  .shell{
    display:flex;
    max-width:1400px;
    margin:0 auto;
    min-height:100vh;
  }

  .sidebar{
    flex:0 0 264px;
    width:264px;
    position:sticky;
    top:0;
    align-self:flex-start;
    height:100vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:26px;
    padding:30px 24px;
    border-right:1px solid var(--line);
  }

  .sidebar-top{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    appearance:none; -webkit-appearance:none;
    display:block;
    background:none;
    border:0;
    padding:0;
    margin:0;
    text-align:left;
    cursor:pointer;
    font-family:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
    font-weight:800;
    font-size:21px;
    line-height:1.2;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .brand:hover{color:var(--accent-ink);}
  .brand:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .sidebar-tag{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .sidebar-section{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .sidebar-section-label{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    padding:0 10px 6px;
  }
  .nav-btn{
    appearance:none; -webkit-appearance:none;
    display:block;
    width:100%;
    text-align:left;
    font:inherit;
    font-size:14px;
    background:transparent;
    border:0;
    border-radius:6px;
    color:var(--ink-soft);
    padding:9px 10px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .nav-btn:hover{background:var(--paper-2); color:var(--ink);}
  .nav-btn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .nav-btn.is-active{background:var(--accent); color:#F4FAF9;}

  .sidebar-foot{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:5px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:11px;
    color:var(--muted);
  }
  .sidebar-foot a{
    color:var(--muted);
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:3px;
  }
  .sidebar-foot a:hover{color:var(--accent-ink); text-decoration-color:var(--accent);}

  .content{
    flex:1 1 auto;
    min-width:0;
    padding:34px 40px 70px;
  }

  /* ---- anasayfa: grup kapağı ızgarası ---- */
  .home-intro{margin-bottom:28px; max-width:64ch;}
  .home-intro h1{
    margin:0 0 8px;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(28px,4vw,42px);
    line-height:1.06;
  }
  .home-intro p{
    margin:0;
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  .note{
    display:flex;
    gap:12px;
    align-items:flex-start;
    border:1px dashed var(--line);
    border-radius:3px;
    padding:14px 16px;
    margin-bottom:28px;
    background:var(--paper-2);
    max-width:70ch;
  }
  .note .dot{
    flex:0 0 auto;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--amber);
    margin-top:6px;
  }
  .note p{
    margin:0;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .note strong{color:var(--ink);}

  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
    gap:3px;
  }
  button.cat-tile{
    appearance:none; -webkit-appearance:none;
    position:relative;
    display:block;
    width:100%;
    margin:0;
    padding:0;
    font:inherit;
    color:inherit;
    text-align:left;
    cursor:pointer;
    border:0;
    border-radius:0;
    overflow:hidden;
    aspect-ratio:3/4;
    background:var(--paper-2);
  }
  button.cat-tile:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .cat-tile canvas{display:block; width:100%; height:100%;}
  .cat-tile img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    background:var(--paper-2);
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    transition:transform .5s ease;
  }
  button.cat-tile:hover img{transform:scale(1.04);}
  .cat-tile-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:24px;
    text-align:center;
    background:rgba(22,124,116,0.86);
    opacity:0;
    transition:opacity .25s ease;
  }
  .cat-tile-overlay .cat-tile-name{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(22px,2.6vw,30px);
    color:#FBFBF9;
  }
  .cat-tile-overlay .cat-tile-sub{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(251,251,249,0.85);
  }
  @media (hover:hover){
    button.cat-tile:hover .cat-tile-overlay,
    button.cat-tile:focus-visible .cat-tile-overlay{opacity:1;}
  }
  @media (hover:none){
    .cat-tile-overlay{
      opacity:1;
      background:linear-gradient(to top, rgba(11,63,59,0.72), rgba(11,63,59,0) 60%);
      justify-content:flex-end;
      align-items:flex-start;
      text-align:left;
      padding:16px 18px 14px;
    }
  }

  /* ---- sayfa panelleri (Hakkımda / İletişim / Sosyal Medya) ---- */
  .page-panel{max-width:620px;}
  .page-panel h2{
    margin:0 0 16px;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(26px,4vw,36px);
  }
  .page-panel p{
    margin:0 0 14px;
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
  }
  .page-panel p:last-child{margin-bottom:0;}
  .page-panel strong{color:var(--ink); font-weight:600;}
  .social-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .social-list a{
    font-size:15px;
    color:var(--accent-ink);
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:3px;
  }
  .social-list a:hover{text-decoration-color:var(--accent);}

  /* ---- grup detayı: geri düğmesi + büyük foto akışı ---- */
  .cat-back{
    appearance:none; -webkit-appearance:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:0;
    padding:0;
    margin-bottom:16px;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--muted);
    cursor:pointer;
  }
  .cat-back:hover{color:var(--accent-ink);}
  .cat-back:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .cat-view-head{max-width:70ch; margin-bottom:8px;}
  .cat-view-head h2{
    margin:0 0 8px;
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(26px,4vw,38px);
  }
  .cat-view-head p{
    margin:0;
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  .cat-feed{
    display:flex;
    flex-direction:column;
    gap:38px;
    margin-top:30px;
    max-width:900px;
  }
  figure.cat-feed-item{margin:0; display:flex; flex-direction:column; gap:10px;}
  button.cat-feed-art{
    appearance:none; -webkit-appearance:none;
    display:block;
    width:100%;
    margin:0;
    padding:0;
    font:inherit;
    color:inherit;
    text-align:left;
    cursor:zoom-in;
    position:relative;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--paper-2);
    box-shadow:var(--frame-shadow);
    overflow:hidden;
  }
  button.cat-feed-art:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .cat-feed-art canvas{display:block; width:100%; height:380px;}
  .cat-feed-art img{
    display:block;
    width:100%;
    max-height:78vh;
    object-fit:contain;
    background:var(--paper-2);
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .frame-no{
    position:absolute;
    top:8px; left:10px;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#F1EFE4;
    text-shadow:0 1px 2px rgba(0,0,0,0.55);
    letter-spacing:0.02em;
  }
  figcaption{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:13px;
    color:var(--muted);
  }
  figcaption .cap{color:var(--ink-soft);}
  figcaption .t{font-family:'Space Mono', monospace; font-size:11px; white-space:nowrap;}

  /* ---- lightbox ---- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .lightbox[hidden]{display:none;}
  .lightbox-backdrop{
    position:absolute;
    inset:0;
    background:rgba(251,251,249,0.86);
    -webkit-backdrop-filter:blur(22px) saturate(1.05);
    backdrop-filter:blur(22px) saturate(1.05);
    border:0;
    padding:0;
    margin:0;
    cursor:default;
  }
  .lightbox-panel{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:96vw;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    overflow-x:hidden;
  }
  .lightbox-close,
  .lightbox-nav{
    position:fixed;
    z-index:3;
    width:40px; height:40px;
    border-radius:50%;
    border:1px solid rgba(38,40,42,0.14);
    background:rgba(251,251,249,0.8);
    color:var(--ink);
    font-size:17px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    box-shadow:0 4px 16px rgba(20,20,18,0.12);
    transition:background .15s ease, transform .15s ease;
  }
  .lightbox-close:hover,
  .lightbox-nav:hover{background:rgba(251,251,249,0.98); transform:scale(1.05);}
  .lightbox-close:focus-visible,
  .lightbox-nav:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .lightbox-close{top:18px; right:18px;}
  .lightbox-nav{top:50%; transform:translateY(-50%); font-size:20px;}
  .lightbox-nav:hover{transform:translateY(-50%) scale(1.05);}
  .lightbox-prev{left:18px;}
  .lightbox-next{right:18px;}
  .lightbox-nav[hidden]{display:none;}
  .lightbox-art{
    position:relative;
    max-width:100%;
    line-height:0;
    border-radius:2px;
    overflow:hidden;
    box-shadow:0 26px 70px rgba(20,20,18,0.28);
  }
  .lightbox-art canvas{display:block; width:480px; max-width:100%; height:320px;}
  .lightbox-art img{
    display:block;
    width:auto;
    height:auto;
    max-width:100%;
    max-height:78vh;
    object-fit:contain;
    -webkit-user-select:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .lightbox-art canvas[hidden], .lightbox-art img[hidden]{display:none;}
  .lightbox-teknik{
    position:absolute;
    right:10px; bottom:10px;
    font-size:10.5px;
    letter-spacing:0.03em;
    color:rgba(251,251,249,0.88);
    background:rgba(20,20,18,0.34);
    padding:4px 9px;
    border-radius:3px;
    text-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  .lightbox-teknik[hidden]{display:none;}
  .lightbox-footer{
    width:100%;
    max-width:100%;
    margin-top:16px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:18px;
    flex-wrap:wrap;
  }
  .lightbox-footer-info{
    display:flex;
    flex-direction:column;
    gap:3px;
    text-align:left;
  }
  .lightbox-cat{
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .lightbox-caption{
    font-family:'Instrument Serif', serif;
    font-style:italic;
    font-size:23px;
    line-height:1.3;
    color:var(--ink);
  }
  .lightbox-desc{
    width:100%;
    margin:14px 0 0;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-soft);
    font-style:italic;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .like-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }
  .like-btn{
    appearance:none;
    -webkit-appearance:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font:inherit;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .like-btn .like-icon{fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round;}
  .like-btn:hover{border-color:var(--accent); color:var(--accent-ink);}
  .like-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .like-btn.is-liked{
    background:var(--accent);
    border-color:var(--accent);
    color:#F4FAF9;
    cursor:default;
  }
  .like-btn.is-liked .like-icon{fill:currentColor;}
  .like-count{font-size:13px;}
  .like-hint{font-size:12px; color:var(--muted);}

  @media (max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{
      position:relative;
      width:100%;
      height:auto;
      flex-direction:column;
      border-right:none;
      border-bottom:1px solid var(--line);
      padding:18px 18px 14px;
      gap:14px;
    }
    .sidebar-top{padding-bottom:14px;}
    .sidebar-section{flex-direction:row; flex-wrap:nowrap; overflow-x:auto; gap:8px; padding-bottom:2px;}
    .sidebar-section-label{display:none;}
    .nav-btn{
      width:auto;
      white-space:nowrap;
      flex:0 0 auto;
      border:1px solid var(--line);
      border-radius:20px;
      padding:7px 14px;
    }
    .nav-btn.is-active{border-color:var(--accent);}
    .sidebar-foot{display:none;}
    .content{padding:22px 18px 50px;}
    .lightbox{padding:10px;}
    .lightbox-panel{max-height:100vh;}
    .lightbox-art img{max-height:64vh;}
    .lightbox-close{top:10px; right:10px; width:34px; height:34px; font-size:15px;}
    .lightbox-nav{width:34px; height:34px; font-size:17px;}
    .lightbox-prev{left:6px;}
    .lightbox-next{right:6px;}
    .lightbox-caption{font-size:19px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
</style>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <button type="button" class="brand" id="brandBtn" data-route="">Ömer Faruk Doğru</button>
      <div class="sidebar-tag">Fotoğraf Günlüğü — İstanbul</div>
    </div>

    <nav class="sidebar-section" aria-label="Sayfalar">
      <div class="sidebar-section-label">Sayfalar</div>
      <button type="button" class="nav-btn" data-route="hakkimda">Hakkımda</button>
      <button type="button" class="nav-btn" data-route="iletisim">İletişim</button>
      <button type="button" class="nav-btn" data-route="sosyal-medya">Sosyal Medya</button>
    </nav>

    <nav class="sidebar-section" aria-label="Gruplar" id="catNav">
      <div class="sidebar-section-label">Gruplar</div>
    </nav>

    <div class="sidebar-foot">
      <span>İstanbul, 2026</span>
      <span><a href="https://omerfarukdogru.com.tr">omerfarukdogru.com.tr</a></span>
      <span class="mono">© ÖMER FARUK DOĞRU</span>
    </div>
  </aside>

  <main class="content" id="content"></main>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-backdrop" id="lbBackdrop" aria-label="Kapat"></button>
  <button class="lightbox-close" id="lbClose" aria-label="Kapat">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Önceki fotoğraf">‹</button>
  <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Sonraki fotoğraf">›</button>
  <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lbCaption">
    <div class="lightbox-art" id="lbArt">
      <canvas id="lbCanvas"></canvas>
      <img id="lbImg" alt="" hidden>
      <span class="frame-no mono" id="lbNo"></span>
      <span class="mono lightbox-teknik" id="lbTeknik"></span>
    </div>
    <div class="lightbox-footer">
      <div class="lightbox-footer-info">
        <span class="mono lightbox-cat" id="lbCat"></span>
        <span class="lightbox-caption" id="lbCaption"></span>
      </div>
      <div class="like-row">
        <button type="button" class="like-btn" id="lbLikeBtn">
          <svg class="like-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-6.9-4.35-9.6-8.35C.7 9.6 1.1 6.1 3.9 4.3c2.3-1.5 5.2-.95 6.95 1.15L12 6.95l1.15-1.5c1.75-2.1 4.65-2.65 6.95-1.15 2.8 1.8 3.2 5.3 1.5 7.85C18.9 16.15 12 20.5 12 20.5z"/></svg>
          <span class="like-count mono" id="lbLikeCount">—</span>
        </button>
        <span class="like-hint">Bu kareyi beğen</span>
      </div>
      <p class="lightbox-desc" id="lbDesc"></p>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // fotoğrafların kolayca sürükleyip kaydedilmesini zorlaştırmak için
  // (not: bu bir kilit değil, sadece caydırıcıdır — ekran görüntüsü her zaman mümkündür)
  document.addEventListener('dragstart', function(e){
    if(e.target && e.target.tagName === 'IMG') e.preventDefault();
  });

  // seeded PRNG so each frame is stable across renders
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // draws a grayscale, grain-textured gradient standing in for a photograph
  function paintFrame(canvas, seed){
    var rng = mulberry32(seed);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = canvas.clientWidth || 300, h = canvas.clientHeight || 200;
    canvas.width = Math.max(1, Math.floor(w*dpr));
    canvas.height = Math.max(1, Math.floor(h*dpr));
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    var lo = 18 + rng()*55;
    var hi = lo + 70 + rng()*90;
    hi = Math.min(hi, 248);
    var angle = rng()*Math.PI*2;
    var x0 = w/2 - Math.cos(angle)*w*0.6, y0 = h/2 - Math.sin(angle)*h*0.6;

  FRAMES.forEach(function(f, idx){ f.seed = idx*97 + 13; });

  // ---- gruplar (Index temasındaki sol menü + kapak fotoğrafı mantığı) ----
  var CATS = [
    {key:'detay', label:'Detay', tag:'Yakın Kadrajlar', blurb:'Küçük dokunuşlar, yakın kadrajlar — günlük hayatın gözden kaçan detayları.', coverN:'004'},

    {key:'istanbul', label:'İstanbul', tag:'Şehir Manzaraları', blurb:'Şehrin ışığı, sokakları ve dokusu üzerine bir seçki.', coverN:'066'},
    {key:'sevimli-dostlar', label:'Sevimli Dostlar', tag:'Hayvan Fotoğrafları', blurb:'Dört ayaklı dostlarla geçen anlar.', coverN:'121'},
    {key:'siyah-beyaz', label:'Siyah Beyaz', tag:'Siyah Beyaz Kareler', blurb:'Renksiz kareler, ışığın ve gölgenin saf hâli.', coverN:'148'}
  ];

  var FRAMES_BY_CAT = {};
  FRAMES.forEach(function(f){
    if(!FRAMES_BY_CAT[f.cat]) FRAMES_BY_CAT[f.cat] = [];
    FRAMES_BY_CAT[f.cat].push(f);
  });

  // sol menüdeki grup listesini doldur
  var catNav = document.getElementById('catNav');
  CATS.forEach(function(c){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'nav-btn';
    btn.dataset.route = c.key;
    btn.textContent = c.label;
    catNav.appendChild(btn);
  });

  var content = document.getElementById('content');

  function makeMedia(f, altPrefix){
    var media;
    if(f.photo){
      media = document.createElement('img');
      media.src = f.photo;
      media.alt = (altPrefix || (f.label + ' — ' + f.cap));
      media.loading = 'lazy';
      media.decoding = 'async';
      media.draggable = false;
      media.oncontextmenu = function(){ return false; };
    } else {
      media = document.createElement('canvas');
    }
    return media;
  }

  function renderHome(){
    content.innerHTML = '';

    var intro = document.createElement('div');
    intro.className = 'home-intro';
    var h1 = document.createElement('h1');
    h1.textContent = 'Işığın kaydı.';
    var p = document.createElement('p');
    p.textContent = 'Doğal ışıkla, çoğu zaman tek karede — 35mm film ve dijitalle çektiğim fotoğraflardan bir seçki. Bir grubu seçince o gruptaki tüm kareleri büyük halleriyle görebilirsin.';
    intro.appendChild(h1);
    intro.appendChild(p);
    content.appendChild(intro);

    var grid = document.createElement('div');
    grid.className = 'cat-grid';

    CATS.forEach(function(c){
      var list = FRAMES_BY_CAT[c.key] || [];
      var cover = list[0];
      if(c.coverN){
        for(var ci=0; ci<list.length; ci++){
          if(list[ci].n === c.coverN){ cover = list[ci]; break; }
        }
      }

      var tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'cat-tile';
      tile.setAttribute('aria-label', c.label + ' grubunu aç');

      var media = makeMedia(cover || {}, c.label);
      tile.appendChild(media);

      var overlay = document.createElement('span');
      overlay.className = 'cat-tile-overlay';

      var name = document.createElement('span');
      name.className = 'cat-tile-name';
      name.textContent = c.label;
      overlay.appendChild(name);

      var sub = document.createElement('span');
      sub.className = 'cat-tile-sub mono';
      sub.textContent = (c.tag || c.label) + ' · ' + list.length + ' kare';
      overlay.appendChild(sub);

      tile.appendChild(overlay);

      tile.addEventListener('click', function(){ goTo(c.key); });

      grid.appendChild(tile);

      if(cover && !cover.photo){
        requestAnimationFrame(function(){ paintFrame(media, cover.seed); });
      }
    });

    content.appendChild(grid);
  }

  function renderCategory(key){
    var c = null;
    for(var i=0;i<CATS.length;i++){ if(CATS[i].key === key){ c = CATS[i]; break; } }
    if(!c){ renderHome(); return; }
    var list = FRAMES_BY_CAT[key] || [];

    content.innerHTML = '';

    var back = document.createElement('button');
    back.type = 'button';
    back.className = 'cat-back mono';
    back.textContent = '← Tüm Gruplar';
    back.addEventListener('click', function(){ goTo(''); });
    content.appendChild(back);

    var head = document.createElement('div');
    head.className = 'cat-view-head';
    var h2 = document.createElement('h2');
    h2.textContent = c.label;
    var p = document.createElement('p');
    p.textContent = c.blurb;
    head.appendChild(h2);
    head.appendChild(p);
    content.appendChild(head);

    var feed = document.createElement('div');
    feed.className = 'cat-feed';

    list.forEach(function(f, idx){
      var item = document.createElement('figure');
      item.className = 'cat-feed-item';

      var trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'cat-feed-art';
      trigger.setAttribute('aria-label', f.label + ' — ' + f.cap + ' — büyütmek için tıkla');

      var media = makeMedia(f);
      trigger.appendChild(media);

      var no = document.createElement('span');
      no.className = 'frame-no mono';
      no.textContent = 'N° ' + f.n;
      trigger.appendChild(no);

      trigger.addEventListener('click', function(){ openLightbox(f, f.seed, list, idx); });

      var figcap = document.createElement('figcaption');
      var capText = document.createElement('span');
      capText.className = 'cap';
      capText.textContent = f.cap;
      figcap.appendChild(capText);
      if(f.teknik){
        var teknikText = document.createElement('span');
        teknikText.className = 't mono';
        teknikText.textContent = f.teknik;
        figcap.appendChild(teknikText);
      }

      item.appendChild(trigger);
      item.appendChild(figcap);
      feed.appendChild(item);

      if(!f.photo){
        requestAnimationFrame(function(){ paintFrame(media, f.seed); });
      }
    });

    content.appendChild(feed);
  }

  function renderAbout(){
    content.innerHTML = '';
    var panel = document.createElement('div');
    panel.className = 'page-panel';
    panel.innerHTML =
      '<h2>Hakkımda</h2>' +
      '<p>Merhaba, ben Ömer Faruk Doğru. İstanbul sokaklarında, sabah erken saatlerin ve akşamüstü ışığının peşinde dolaşarak fotoğraf çekiyorum. Çoğu kare 35mm film, bazıları dijital — ama hepsi kadrajı beklemek üzerine kurulu.</p>' +
      '<p>Bu sayfa, kendi işlerimi bir araya topladığım <strong>kişisel bir kontak föy</strong>: sol menüden bir grup seçerek fotoğraflarımı takip edebilirsin.</p>';
    content.appendChild(panel);
  }

  function renderContact(){
    content.innerHTML = '';
    var panel = document.createElement('div');
    panel.className = 'page-panel';
    panel.innerHTML =
      '<h2>İletişim</h2>' +
      '<p>Fotoğraflarla ilgili bir sorun, iş birliği teklifin ya da baskı talebin varsa aşağıdaki kanaldan ulaşabilirsin.</p>' +
      '<p class="mono">[ buraya e-posta adresini ekle ]</p>';
    content.appendChild(panel);
  }

  function renderSocial(){
    content.innerHTML = '';
    var panel = document.createElement('div');
    panel.className = 'page-panel';
    panel.innerHTML =
      '<h2>Sosyal Medya</h2>' +
      '<p>Daha fazla kare ve kayıt dışı paylaşımlar için:</p>' +
      '<ul class="social-list">' +
        '<li><a href="#" class="mono">[ Instagram linkini buraya ekle ]</a></li>' +
      '</ul>';
    content.appendChild(panel);
  }

  // ---- yönlendirme (URL karmasıyla: paylaşılabilir bağlantılar için) ----
  function setActive(routeId){
    document.querySelectorAll('.nav-btn').forEach(function(b){
      b.classList.toggle('is-active', b.dataset.route === routeId);
    });
    document.getElementById('brandBtn').classList.toggle('is-active', routeId === '');
  }

  function route(){
    var hash = decodeURIComponent(location.hash.replace('#',''));
    if(hash === 'hakkimda'){ renderAbout(); setActive('hakkimda'); }
    else if(hash === 'iletisim'){ renderContact(); setActive('iletisim'); }
    else if(hash === 'sosyal-medya'){ renderSocial(); setActive('sosyal-medya'); }
    else if(FRAMES_BY_CAT.hasOwnProperty(hash)){ renderCategory(hash); setActive(hash); }
    else { renderHome(); setActive(''); }
    window.scrollTo(0,0);
    content.scrollTop = 0;
  }

  function goTo(routeId){
    if(location.hash.replace('#','') === routeId){ route(); }
    else { location.hash = routeId; }
  }

  document.querySelectorAll('[data-route]').forEach(function(el){
    el.addEventListener('click', function(){ goTo(el.dataset.route); });
  });
  window.addEventListener('hashchange', route);

  // ---- girişsiz beğeni sistemi ----
  // Paylaşılan (herkes için ortak) sayaç, ücretsiz ve hesap gerektirmeyen bir
  // genel API üzerinden tutuluyor. Servis geçici olarak yanıt vermezse buton
  // yine de "beğenildi" görünür, sadece sayı görünmez — sayfa asla bozuk görünmez.
  var LIKE_NAMESPACE = 'omerfarukdogru-com-tr';
  var lbLikeBtn = document.getElementById('lbLikeBtn');
  var lbLikeCount = document.getElementById('lbLikeCount');

  function likeKey(term){ return 'begeni:' + term; }
  function hasLiked(term){
    try { return window.localStorage.getItem(likeKey(term)) === '1'; }
    catch(e){ return false; }
  }
  function markLiked(term){
    try { window.localStorage.setItem(likeKey(term), '1'); }
    catch(e){ /* localStorage yoksa sorun değil, sadece hatırlanmaz */ }
  }
  function renderLike(count, liked){
    lbLikeCount.textContent = (count === null || count === undefined) ? '—' : String(count);
    lbLikeBtn.classList.toggle('is-liked', !!liked);
    lbLikeBtn.disabled = !!liked;
  }
  function fetchLikeCount(term){
    fetch('https://api.countapi.xyz/get/' + LIKE_NAMESPACE + '/' + term)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(lbLikeBtn.dataset.term !== term) return; // kullanıcı arada başka kareye geçtiyse yoksay
        var count = (data && typeof data.value === 'number') ? data.value : null;
        renderLike(count, hasLiked(term));
      })
      .catch(function(){ /* sessizce geç */ });
  }
  lbLikeBtn.addEventListener('click', function(){
    var term = lbLikeBtn.dataset.term;
    if(!term || hasLiked(term)) return;
    markLiked(term);
    renderLike(null, true);
    fetch('https://api.countapi.xyz/hit/' + LIKE_NAMESPACE + '/' + term)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(lbLikeBtn.dataset.term !== term) return;
        var count = (data && typeof data.value === 'number') ? data.value : null;
        renderLike(count, true);
      })
      .catch(function(){ /* sessizce geç, buton yine de beğenilmiş görünür */ });
  });

  // ---- lightbox ----
  var lightbox = document.getElementById('lightbox');
  var lbArt = document.getElementById('lbArt');
  var lbCanvas = document.getElementById('lbCanvas');
  var lbImg = document.getElementById('lbImg');
  var lbNo = document.getElementById('lbNo');
  var lbCat = document.getElementById('lbCat');
  var lbCaption = document.getElementById('lbCaption');
  var lbTeknik = document.getElementById('lbTeknik');
  var lbDesc = document.getElementById('lbDesc');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var lastFocused = null;
  var lbList = null;   // açık karenin ait olduğu grup listesi (klavye/ok navigasyonu için)
  var lbIndex = -1;    // o listedeki geçerli konum

  function updateNavVisibility(){
    var canNav = !!(lbList && lbList.length > 1);
    lbPrev.hidden = !canNav;
    lbNext.hidden = !canNav;
  }

  function openLightbox(f, seed, list, idx){
    lastFocused = document.activeElement;
    lbList = list || null;
    lbIndex = (typeof idx === 'number') ? idx : -1;
    updateNavVisibility();

    lbNo.textContent = 'N° ' + f.n;
    lbCat.textContent = f.label;
    lbCaption.textContent = f.cap;
    if(f.teknik){
      lbTeknik.textContent = f.teknik;
      lbTeknik.hidden = false;
    } else {
      lbTeknik.textContent = '';
      lbTeknik.hidden = true;
    }
    var descText = f.desc || (f.photo ? '' : PLACEHOLDER_DESC);
    lbDesc.textContent = descText;
    lbDesc.hidden = !descText;
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
    if(f.photo){
      lbArt.classList.add('is-photo');
      lbImg.src = f.photo;
      lbImg.alt = f.label + ' — ' + f.cap;
      lbImg.draggable = false;
      lbImg.oncontextmenu = function(){ return false; };
      lbImg.hidden = false;
      lbCanvas.hidden = true;
    } else {
      lbArt.classList.remove('is-photo');
      lbCanvas.hidden = false;
      lbImg.hidden = true;
      requestAnimationFrame(function(){ paintFrame(lbCanvas, seed); });
    }

    var term = 'foto-' + f.n;
    lbLikeBtn.dataset.term = term;
    renderLike(null, hasLiked(term));
    fetchLikeCount(term);

    document.getElementById('lbClose').focus();
  }

  function showLightboxAt(newIndex){
    if(!lbList || !lbList.length) return;
    var wrapped = (newIndex + lbList.length) % lbList.length;
    var f = lbList[wrapped];
    lbIndex = wrapped;
    openLightbox(f, f.seed, lbList, wrapped);
  }

  function lightboxPrev(){ if(lbList && lbList.length > 1) showLightboxAt(lbIndex - 1); }
  function lightboxNext(){ if(lbList && lbList.length > 1) showLightboxAt(lbIndex + 1); }

  function closeLightbox(){
    lightbox.hidden = true;
    document.body.style.overflow = '';
    lbList = null;
    lbIndex = -1;
    if(lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbBackdrop').addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', lightboxPrev);
  lbNext.addEventListener('click', lightboxNext);
  document.addEventListener('keydown', function(e){
    if(lightbox.hidden) return;
    if(e.key === 'Escape'){ closeLightbox(); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); lightboxPrev(); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); lightboxNext(); return; }
  });

  // ---- ilk yükleme ----
  route();
})();
</script>
